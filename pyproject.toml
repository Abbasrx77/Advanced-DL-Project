[project]
name = "eurosat-assistant"
version = "0.1.0"
description = "Multimodal AI assistant on the EuroSAT dataset (ISEP IG.3513 course project)."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
